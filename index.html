    <main>
        <section class="about-me" id="sobre-mim">
            <div class="introduction" aria-label="Terminal interativo com informações sobre Thales Karam">
                <div class="terminal-header">
                    <div class="terminal-buttons" aria-hidden="true">
                        <span class="terminal-button close"></span>
                        <span class="terminal-button minimize"></span>
                        <span class="terminal-button expand"></span>
                    </div>
                    <p class="terminal-title">thales@portfolio:~</p>
                </div>
                <div class="terminal-body">
                    <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
                    <form class="terminal-form" id="terminal-form" autocomplete="off">
                        <label class="terminal-prompt" for="terminal-input">thales@portfolio:~$</label>
                        <input class="terminal-input" id="terminal-input" name="command" type="text" spellcheck="false"
                            placeholder="digite --help" aria-label="Digite um comando no terminal">
                    </form>
                </div>
            </div>
        </section>
    </main>
